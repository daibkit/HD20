<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị — Anh em ơi! Về nhà</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: sticky pill-nav header (as on the event site) → navy gradient page band with breadcrumb → 1240px content column of cards/tables. */
:root{
  --bg:#FAFCFD; --surface:#FFFFFF; --tint:#EAF5FB; --tint-2:#F3F8FB;
  --ink:#13204A; --ink-strong:#16285E; --body:#3C4A6E; --muted:#56617D; --faint:#8A93AC;
  --line:#E3ECF3; --line-strong:#CBD9E6;
  --brand:#0E4C9C; --sky:#2BBDE6; --orange:#F28A55; --gold:#F6CF5C; --green:#2AA56A; --danger:#C2412D;
  --grad:linear-gradient(90deg,#F28A55,#F6CF5C);
  --hero:linear-gradient(180deg,#3165AC 0%,#174D9C 55%,#1A2D62 100%);
  --hero-ink:#FFFFFF; --hero-soft:#A9D8F2; --hero-body:#DCEBF8;
  --pub-bg:#DDF2E5; --pub-fg:#1F7A4C; --draft-bg:#FBF0D2; --draft-fg:#875A00; --arch-bg:#E7EBF3; --arch-fg:#56617D;
  --act-bg:#DDF2FA; --act-fg:#0B6A8E; --inact-bg:#F7E6DC; --inact-fg:#9A4A2A;
  --danger-bg:#FBE7E3; --warn-bg:#FFF6E6; --warn-line:#F6CF5C;
  --shadow:0 1px 2px rgba(19,32,74,.06),0 8px 24px rgba(19,32,74,.06);
  --ring:0 0 0 3px rgba(43,189,230,.35);
  --f-display:'Raleway',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Raleway',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-card:24px; --r-ctl:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1633; --surface:#141F44; --tint:#1A2A57; --tint-2:#17244C;
  --ink:#E9F1FA; --ink-strong:#F2F7FD; --body:#C6D3E8; --muted:#9FAECB; --faint:#7483A6;
  --line:#26356A; --line-strong:#33457F;
  --brand:#7FD3F0; --sky:#55D0F2; --danger:#FF8A75;
  --pub-bg:#123F2C; --pub-fg:#8FE0B3; --draft-bg:#43350D; --draft-fg:#F6D77E; --arch-bg:#253259; --arch-fg:#B4C0DA;
  --act-bg:#103A4D; --act-fg:#8EDCF5; --inact-bg:#4A2A1E; --inact-fg:#F5B497;
  --danger-bg:#4A1D17; --warn-bg:#3A2F12; --warn-line:#8F7426;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1633; --surface:#141F44; --tint:#1A2A57; --tint-2:#17244C;
  --ink:#E9F1FA; --ink-strong:#F2F7FD; --body:#C6D3E8; --muted:#9FAECB; --faint:#7483A6;
  --line:#26356A; --line-strong:#33457F;
  --brand:#7FD3F0; --sky:#55D0F2; --danger:#FF8A75;
  --pub-bg:#123F2C; --pub-fg:#8FE0B3; --draft-bg:#43350D; --draft-fg:#F6D77E; --arch-bg:#253259; --arch-fg:#B4C0DA;
  --act-bg:#103A4D; --act-fg:#8EDCF5; --inact-bg:#4A2A1E; --inact-fg:#F5B497;
  --danger-bg:#4A1D17; --warn-bg:#3A2F12; --warn-line:#8F7426;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
::selection{background:var(--gold);color:#13204A}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
.ic{flex:0 0 auto;display:block}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px 16px;padding-block:8px;flex-wrap:wrap}
h1[tabindex="-1"]:focus{box-shadow:none;outline:none}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:2px;text-align:left}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{display:block;font-weight:800;font-size:15px;color:var(--ink-strong);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mainnav{display:flex;gap:2px;order:3;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;margin-top:-2px}
.mainnav::-webkit-scrollbar{display:none}
.navpill{flex:0 0 auto;border:0;cursor:pointer;font-size:14px;font-weight:600;padding:9px 12px;border-radius:999px;white-space:nowrap;color:var(--body);background:transparent}
.navpill:hover{background:var(--tint)}
.navpill[aria-current="page"]{background:var(--tint);color:var(--brand)}
.top-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.gsearch{position:relative}
.gsearch input{width:220px;max-width:42vw;padding:9px 12px 9px 34px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.gsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.store-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.store-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.store-pill.cloud .dot{background:var(--green)}
.store-pill.local .dot{background:var(--gold)}
@media (max-width:1180px){.gsearch input{width:170px}.store-pill .lbl{display:none}}
@media (max-width:900px){
  .topbar{position:static}
  .topbar-in{gap:8px;flex-wrap:wrap}
  .bulk{top:0}
  .mainnav{order:3;flex-basis:100%}
  .gsearch input{width:160px}
  .store-pill .lbl{display:none}
}
@media (max-width:640px){.top-tools{flex-wrap:wrap;flex:1 1 100%;margin-left:0}.gsearch{flex:1 1 140px}.gsearch input{width:100%;max-width:none}}
@media (max-width:520px){.top-new .lbl{display:none}.gsearch input{width:130px}.brand small{display:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid transparent;cursor:pointer;font-weight:700;font-size:14.5px;padding:10px 18px;border-radius:999px;white-space:nowrap;text-decoration:none;line-height:1.2;transition:filter .15s,background .15s,transform .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-grad{background:var(--grad);color:#fff;text-shadow:0 1px 1px rgba(150,70,20,.25)}
.btn-grad:hover:not(:disabled){filter:brightness(1.06)}
.btn-navy{background:#16285E;color:#fff}
.btn-navy:hover:not(:disabled){background:#0E4C9C}
.btn-line{background:var(--surface);color:var(--ink-strong);border-color:var(--line-strong)}
.btn-line:hover:not(:disabled){background:var(--tint)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover:not(:disabled){background:var(--tint)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){filter:brightness(1.08)}
.btn-danger-line{background:var(--surface);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn-danger-line:hover:not(:disabled){background:var(--danger-bg)}
.btn-sm{font-size:13px;padding:7px 12px}
.btn-hero{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn-hero:hover{background:rgba(255,255,255,.1)}
.ibtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.ibtn:hover:not(:disabled){background:var(--tint);color:var(--brand)}
.ibtn.danger:hover:not(:disabled){background:var(--danger-bg);color:var(--danger)}
.ibtn:disabled{opacity:.3;cursor:not-allowed}

/* Page band */
.band{background:var(--hero);color:var(--hero-ink)}
.band-in{padding-block:26px 30px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.band-l{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 420px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--hero-soft);font-weight:600}
.crumbs button{border:0;background:none;color:var(--hero-soft);cursor:pointer;padding:2px 4px;border-radius:6px;font-weight:600}
.crumbs button:hover{color:#fff;text-decoration:underline}
.crumbs .sep{opacity:.6}
.crumbs .here{color:#fff;padding:2px 4px}
.band h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.band p{margin:0;color:var(--hero-body);max-width:680px;text-wrap:pretty}
.band-r{display:flex;flex-wrap:wrap;gap:10px}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.3);background:rgba(10,25,70,.25);color:#fff;border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start}
.backbtn:hover{background:rgba(255,255,255,.12)}

main.view{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-pad{padding:clamp(16px,2.2vw,24px)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2,.h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink-strong);letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}

/* Stat tiles — echo of the site's "20 năm" number cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.stat{padding:18px 20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,3.6vw,46px);line-height:1;letter-spacing:-.02em}
.stat .l{font-weight:700;font-size:15px;color:var(--ink-strong)}
.stat .s{font-size:13px;color:var(--muted)}
.n-orange{color:var(--orange)} .n-sky{color:var(--sky)} .n-green{color:var(--green)} .n-gold{color:#D9A21F} .n-brand{color:var(--brand)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-published{background:var(--pub-bg);color:var(--pub-fg)}
.st-draft{background:var(--draft-bg);color:var(--draft-fg)}
.st-draft::before{background:transparent;border:2px solid currentColor;width:8px;height:8px}
.st-archived{background:var(--arch-bg);color:var(--arch-fg)}
.st-archived::before{border-radius:2px}
.st-active{background:var(--act-bg);color:var(--act-fg)}
.st-inactive{background:var(--inact-bg);color:var(--inact-fg)}
.st-inactive::before{background:transparent;border:2px dashed currentColor;width:8px;height:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--brand);border:0}
button.chip{cursor:pointer}
button.chip:hover{filter:brightness(.97)}

/* Toolbar & forms */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px;border-radius:20px;background:var(--tint-2);border:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl-t{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.req{color:var(--danger)}
.inp,.sel,.ta{width:100%;padding:10px 12px;border-radius:var(--r-ctl);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);min-height:42px}
.sel{padding-right:30px}
.ta{min-height:90px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--sky);box-shadow:var(--ring)}
.inp[aria-invalid="true"],.sel[aria-invalid="true"],.ta[aria-invalid="true"]{border-color:var(--danger)}
.inp-lg{font-size:22px;font-weight:700;font-family:var(--f-display);padding:12px 14px}
.err{margin:0;color:var(--danger);font-size:13px;font-weight:600}
.hint{margin:0;color:var(--muted);font-size:12.5px}
.f-q{flex:2 1 220px}.f-s{flex:1 1 150px}.f-d{flex:1 1 140px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox .inp{padding-left:36px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.formgrid .full{grid-column:1/-1}
@media (max-width:560px){.formgrid{grid-template-columns:1fr}}
.slugrow{display:flex;align-items:stretch;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);overflow:hidden}
.slugrow:focus-within{border-color:var(--sky);box-shadow:var(--ring)}
.slugrow span{padding:10px 0 10px 12px;color:var(--faint);font-family:var(--f-mono);font-size:13px;white-space:nowrap;align-self:center}
.slugrow input{border:0;outline:none;min-width:0;flex:1;padding:10px 12px 10px 2px;font-family:var(--f-mono);font-size:13.5px;background:transparent}
.slugrow input:focus{box-shadow:none}
.slugrow[aria-invalid="true"]{border-color:var(--danger)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(18px)}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);cursor:pointer}
.radio-card:has(input:checked){border-color:var(--sky);background:var(--tint-2)}
.radio-card input{margin-top:4px;accent-color:#0E4C9C}
.radio-card b{display:block;color:var(--ink-strong)}
.ack{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.ack input{width:18px;height:18px;accent-color:#0E4C9C;margin:0}

/* Image field */
.imgfld{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.imgprev{width:96px;height:72px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--tint) 0 8px,var(--tint-2) 8px 16px);border:1px solid var(--line);overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgfld-c{flex:1 1 200px;display:flex;flex-direction:column;gap:8px;min-width:0}
.imgfld-row{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Tables */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--tint-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .actions{text-align:right;white-space:nowrap}
.tbl .chk{width:36px}
.tbl input[type=checkbox],.chkbox{width:18px;height:18px;accent-color:#0E4C9C;cursor:pointer}
.tt{display:flex;gap:12px;align-items:center;min-width:0}
.tt .thumb{width:56px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--tint)}
.tt .ph{width:56px;height:42px;border-radius:10px;flex:0 0 auto;background:repeating-linear-gradient(135deg,var(--tint) 0 7px,var(--tint-2) 7px 14px)}
.tt-t{min-width:0}
.tt-t button.link,.link{border:0;background:none;padding:0;color:var(--ink-strong);font-weight:700;cursor:pointer;text-align:left;font-size:15px;line-height:1.3}
.tt-t button.link:hover,.link:hover{color:var(--brand);text-decoration:underline}
.tt-t .sub{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.tt-t .ex{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:420px}
.ord{display:flex;align-items:center;gap:2px}
.ord .v{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.togglest{border:0;cursor:pointer;background:none;padding:0}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:14px;border-bottom:1px solid var(--line)}
  .tbl td{display:flex;align-items:center;gap:8px;padding:0;border:0;min-width:0}
  .tbl td[data-label]::before{content:attr(data-label);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-width:84px}
  .tbl td.main{grid-column:1/-1}
  .tbl td.chk{grid-row:1}
  .tbl td.chk+td.main{grid-column:2}
  .tbl td.wide{grid-column:1/-1}
  .tbl .actions{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .tbl .num{text-align:left}
  .tt-t .sub,.tt-t .ex{max-width:none}
}

/* Bulk bar & pager */
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:#16285E;color:#fff;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:5}
.bulk b{margin-right:auto}
.bulk .btn-line{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.bulk .btn-line:hover{background:rgba(255,255,255,.1)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.pager-n{display:flex;gap:4px;flex-wrap:wrap}
.pg{min-width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pg[aria-current="page"]{background:#16285E;color:#fff;border-color:#16285E}
.pg:disabled{opacity:.4;cursor:not-allowed}

/* Empty & loading */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px}
.empty .art{width:72px;height:72px;border-radius:22px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.empty h3{margin:0;font-size:18px;color:var(--ink-strong)}
.empty p{margin:0;color:var(--muted);max-width:460px}
.skel{border-radius:16px;background:linear-gradient(90deg,var(--tint) 0%,var(--tint-2) 50%,var(--tint) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

function band({crumbs = [], title, sub = '', right = '', eyebrow = '', showBack = true}) {
  const cr = crumbs.map((c, i) => i === crumbs.length - 1 ? `<span class="here" aria-current="page">${esc(c[0])}</span>` : `<button data-act="go" data-r="${esc(c[1])}" ${c[2] ? `data-p='${esc(JSON.stringify(c[2]))}'` : ''}>${esc(c[0])}</button><span class="sep" aria-hidden="true">/</span>`).join('');
  return `<section class="band"><div class="wrap band-in"><div class="band-l">
    ${showBack && S.history.length ? `<button class="backbtn" data-act="back">${icon('back', 16)} Quay lại</button>` : ''}
    ${crumbs.length ? `<nav class="crumbs" aria-label="Đường dẫn trang">${cr}</nav>` : ''}
    ${eyebrow ? `<span class="eyebrow" style="color:var(--hero-soft)">${eyebrow}</span>` : ''}
    <h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right ? `<div class="band-r">${right}</div>` : ''}</div></section>`;
}
function emptyBox({ic = 'doc', title, text = '', action = ''}) { return `<div class="empty"><div class="art">${icon(ic, 32, 1.8)}</div><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}${action}</div>`; }
const goAttr = (r, p) => `data-act="go" data-r="${r}"${p ? ` data-p='${esc(JSON.stringify(p))}'` : ''}`;
const thumb = src => { const s = safeImg(src); return s ? `<img class="thumb" src="${esc(s)}" alt="" loading="lazy">` : `<span class="ph" aria-hidden="true"></span>`; };
function sel(id, opts, value, extra = '') { return `<select id="${id}" class="sel" ${extra}>${opts.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(value) ? 'selected' : ''} ${o[2] ? 'disabled' : ''}>${esc(o[1])}</option>`).join('')}</select>`; }
const secOptions = (first = 'Tất cả chuyên mục') => [['', first], ...D.sections().map(s => [s.id, s.name + (s.status === 'inactive' ? ' (tạm ẩn)' : '')])];
function catOptions(secId, first = 'Tất cả danh mục') {
  const out = [['', first]];
  if (secId) D.catsOf(secId).forEach(c => out.push([c.id, c.name + (c.status === 'inactive' ? ' (tạm ẩn)' : '')]));
  else D.sections().forEach(s => D.catsOf(s.id).forEach(c => out.push([c.id, s.name + ' › ' + c.name])));
  return out;
}
const crumbsHome = [['Tổng quan', 'dashboard']];

      <td class="main"><div class="tt">${thumb(s.image)}<div class="tt-t"><button class="link" ${goAttr('section', {id: s.id})}>${esc(s.name)}</button><div class="sub">/${esc(s.slug)}</div></div></div></td>

      <div class="fld f-s"><label for="fs-sort">Sắp xếp</label>${sel('fs-sort', [['order', 'Thứ tự hiển thị'], ['name', 'Tên A–Z'], ['updatedAt-desc', 'Mới cập nhật'], ['createdAt-desc', 'Mới tạo']], f.sort, 'data-f="sections.sort"')}</div>

  html += arts.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Bài viết</th><th>Danh mục</th><th>Trạng thái</th><th>Cập nhật</th><th class="actions"><span class="sr">Thao tác</span></th></tr></thead><tbody>${articleRows(arts.slice(0, 8), {compact: true})}</tbody></table></div>` : emptyBox({title: 'Chưa có bài viết trong chuyên mục'});

/* ---- Categories ---- */
function categoryRows(list, {showOrder, showSection = true}) {
  return list.map(c => {
    const s = D.sec(c.sectionId), sibs = D.catsOf(c.sectionId), i = sibs.findIndex(x => x.id === c.id), na = D.artsOfCat(c.id).length;
    return `<tr>
      ${showOrder ? `<td data-label="Thứ tự"><div class="ord">${W() ? `<button class="ibtn" data-act="move" data-kind="categories" data-id="${esc(c.id)}" data-dir="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Đưa “${esc(c.name)}” lên trên">${icon('up', 16)}</button>` : ''}<span class="v">${esc(c.order)}</span>${W() ? `<button class="ibtn" data-act="move" data-kind="categories" data-id="${esc(c.id)}" data-dir="1" ${i >= sibs.length - 1 ? 'disabled' : ''} aria-label="Đưa “${esc(c.name)}” xuống dưới">${icon('down', 16)}</button>` : ''}</div></td>` : `<td data-label="Thứ tự" class="num">${esc(c.order)}</td>`}
      <td class="main"><div class="tt">${thumb(c.image)}<div class="tt-t"><button class="link" ${goAttr('category', {id: c.id})}>${esc(c.name)}</button><div class="sub">/${esc(s ? s.slug : '?')}/${esc(c.slug)}</div></div></div></td>
      ${showSection ? `<td data-label="Chuyên mục">${s ? `<button class="link" style="font-weight:600;font-size:14px" ${goAttr('section', {id: s.id})}>${esc(s.name)}</button>` : '<span class="pill st-inactive">Thiếu chuyên mục</span>'}</td>` : ''}
      <td class="num" data-label="Bài viết"><button class="chip" data-act="filter-articles" data-cat="${esc(c.id)}">${na}</button></td>
      <td data-label="Trạng thái">${W() ? `<button class="togglest" data-act="toggle" data-kind="categories" data-id="${esc(c.id)}" title="Bấm để ${c.status === 'active' ? 'tạm ẩn' : 'hiển thị'}" aria-label="${STATUS_S[c.status]} — bấm để ${c.status === 'active' ? 'tạm ẩn' : 'hiển thị'}">${pillS(c.status)}</button>` : pillS(c.status)}</td>
      ${showSection ? `<td data-label="Cập nhật" class="small muted">${fmtDate(c.updatedAt)}</td>` : ''}
      <td class="actions"><button class="ibtn" ${goAttr('category', {id: c.id})} aria-label="Xem bài viết trong “${esc(c.name)}”" title="Chi tiết">${icon('eye')}</button>${W() ? `<button class="ibtn" data-act="edit-category" data-id="${esc(c.id)}" aria-label="Sửa “${esc(c.name)}”" title="Sửa">${icon('edit')}</button><button class="ibtn danger" data-act="delete-category" data-id="${esc(c.id)}" aria-label="Xoá “${esc(c.name)}”" title="Xoá">${icon('trash')}</button>` : ''}</td></tr>`;
  }).join('');
}
VIEWS.categories = () => {
  const f = S.filters.categories; const q = fold(f.q.trim());
  if (f.section && !D.sec(f.section)) f.section = '';
  let list = D.allCats().filter(c => (!f.section || c.sectionId === f.section) && (!f.status || c.status === f.status) && (!q || fold(c.name + ' ' + c.slug + ' ' + c.description).includes(q)));
  const sorters = {order: null, name: (a, b) => cmp(a.name, b.name), 'updatedAt-desc': (a, b) => cmp(b.updatedAt, a.updatedAt), articles: (a, b) => D.artsOfCat(b.id).length - D.artsOfCat(a.id).length};
  if (sorters[f.sort]) list.sort(sorters[f.sort]);

/* ---- Articles ---- */
function articleActions(a) {

}
function articleRows(list, {compact = false, selectable = false} = {}) {
  return list.map(a => {
    const s = D.sec(a.sectionId), c = D.cat(a.categoryId);
    return `<tr>
      ${selectable ? `<td class="chk"><input type="checkbox" data-act="sel" data-id="${esc(a.id)}" ${S.selected.has(a.id) ? 'checked' : ''} aria-label="Chọn “${esc(a.title)}”"></td>` : ''}

      ${compact ? `<td data-label="Danh mục" class="small">${c ? esc(c.name) : '<span class="pill st-inactive">Thiếu</span>'}</td>` : `<td data-label="Phân loại" class="small"><div>${s ? `<button class="link" style="font-size:13.5px;font-weight:600" ${goAttr('section', {id: s.id})}>${esc(s.name)}</button>` : '—'}</div><div>${c ? `<button class="link" style="font-size:13px;font-weight:500;color:var(--muted)" ${goAttr('category', {id: c.id})}>› ${esc(c.name)}</button>` : '<span class="pill st-inactive">Thiếu danh mục</span>'}</div></td>`}
      <td data-label="Trạng thái">${pillA(a.status)}</td>
      ${compact ? '' : `<td data-label="Tác giả" class="small">${esc(a.author || '—')}</td>`}
      <td data-label="Cập nhật" class="small muted tnum" title="Tạo: ${fmtDate(a.createdAt)}${a.publishedAt ? ' · Xuất bản: ' + fmtDate(a.publishedAt) : ''}">${fmtDate(a.updatedAt)}</td>
      <td class="actions">${articleActions(a)}</td></tr>`;
  }).join('');
}
function filteredArticles() {
  const f = S.filters.articles; const q = fold(f.q.trim());
  if (f.section && !D.sec(f.section)) f.section = '';
  if (f.category && !D.cat(f.category)) f.category = '';
  const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : null, to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : null;
  let list = Store.data.articles.filter(a => {
    if (f.section && a.sectionId !== f.section) return false;
    if (f.category && a.categoryId !== f.category) return false;
    if (f.status && a.status !== f.status) return false;
    if (from || to) { const v = a[f.dateField]; if (!v) return false; const t = new Date(v).getTime(); if (from && t < from) return false; if (to && t > to) return false; }
    if (q) { const hay = fold([a.title, a.slug, a.excerpt, a.author, (a.tags || []).join(' '), textOf(a.content)].join(' ')); if (!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  });
  const [field, dir] = f.sort.split('-'); const m = dir === 'asc' ? 1 : -1;
  list.sort((a, b) => field === 'title' ? m * cmp(a.title, b.title) : m * cmp(a[field] || '', b[field] || ''));
  if (q) { const score = a => fold(a.title).includes(q) ? 2 : fold(a.excerpt + ' ' + (a.tags || []).join(' ') + ' ' + textOf(a.content)).includes(q) ? 1 : 0; const sc = new Map(list.map(a => [a.id, score(a)])); list = list.map((a, i) => [a, i]).sort((x, y) => sc.get(y[0].id) - sc.get(x[0].id) || x[1] - y[1]).map(x => x[0]); }
  return list;
}

  else if (!list.length) html += `<div class="card">${emptyBox({ic: 'search', title: 'Không tìm thấy bài viết phù hợp', text: 'Thử bớt điều kiện lọc hoặc dùng từ khoá khác.', action: `<button class="btn btn-line" data-act="reset-filters" data-view="articles">Đặt lại bộ lọc</button>`})}</div>`;

/* ---- Public site preview ---- */

  const cardOf = a => { const c = D.cat(a.categoryId), img = safeImg(a.cover); return `<button class="acard" ${goAttr('site', {sec: a.sectionId, art: a.id})}>${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<span class="ph" style="display:block;aspect-ratio:16/10"></span>'}<div class="in"><span class="eyebrow">${esc(c ? c.name : '')}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt || textOf(a.content).slice(0, 160))}</p><span class="small muted">${fmtDate(a.publishedAt, false)}</span></div></button>`; };
  let html = `<div class="wrap" style="padding-top:14px"><div class="prevbar"><span>${icon('globe', 16)} <b>Xem trang công khai</b> — chỉ hiện bài đã xuất bản trong chuyên mục và danh mục đang hiển thị.</span><button class="btn btn-line btn-sm" ${goAttr('dashboard')}>Thoát xem trang</button></div></div>`;
  html += `<section class="site-band" style="margin-top:14px"><div class="wrap site-band-in"><button class="brand" ${goAttr('site', {})} style="color:#fff"><img class="site-logo" src="img/anh-em-oi.webp" alt="Anh em ơi! Về nhà — 20 năm"></button><div style="display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 320px"><h1 style="margin:0;font-size:clamp(24px,3vw,36px);line-height:1.1"><span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">20 năm</span> chung một mái nhà</h1>
    <nav class="site-pills" aria-label="Chuyên mục">${secs.map(s => `<button class="site-pill" ${goAttr('site', {sec: s.id})} ${sec === s.id ? 'aria-current="page"' : ''}>${esc(s.name)}</button>`).join('')}</nav></div></div></section><main class="view"><div class="wrap stack">`;
  if (art) {
    const a = D.art(art); const ok = a && pubOf(x => x.id === a.id).length;
    if (!ok) return html + emptyBox({title: 'Bài viết không hiển thị trên trang', text: 'Bài này chưa xuất bản, hoặc chuyên mục/danh mục của bài đang tạm ẩn.', action: `<button class="btn btn-line" data-act="back">Quay lại</button>`}) + '</div></main>';
    return html + `<div class="band" style="border-radius:28px"><div class="band-in" style="padding:26px"><div class="band-l"><button class="backbtn" data-act="back">${icon('back', 16)} Quay lại</button>${readHero(a)}</div></div></div>${articleBody(a)}</div></main>`;
  }
  if (sec) {
    const s = D.sec(sec);
    if (!s || s.status !== 'active') return html + emptyBox({title: 'Chuyên mục đang tạm ẩn', action: `<button class="btn btn-line" ${goAttr('site', {})}>Về trang chủ</button>`}) + '</div></main>';
    const cats = visibleCats(s.id); const cur = cat && cats.some(c => c.id === cat) ? cat : '';
    const arts = pubOf(a => a.sectionId === s.id && (!cur || a.categoryId === cur));
    html += `<div class="stack" style="gap:12px"><span class="eyebrow">Chuyên mục</span><h2 class="h2" style="font-size:clamp(26px,3vw,36px)">${esc(s.name)}</h2>${s.description ? `<p class="muted" style="margin:0;max-width:680px">${esc(s.description)}</p>` : ''}

    html += arts.length ? `<div class="cards">${arts.map(cardOf).join('')}</div>` : emptyBox({title: 'Chưa có bài viết đã xuất bản', text: 'Bài viết sẽ xuất hiện ở đây sau khi được xuất bản.'});

/* ---- Global search ---- */
VIEWS.search = () => {

  if (!secs.length && !cats.length && !arts.length) return html + `<div class="card">${emptyBox({ic: 'search', title: 'Không có kết quả', text: 'Thử từ khoá ngắn hơn hoặc từ khác.'})}</div></div></main>`;

  return html + `</div></main>`;

function imgField(prefix, value, label = 'Ảnh hoặc biểu tượng') {
  const v = safeImg(value), isData = v.startsWith('data:');
  return `<div class="fld full"><span class="lbl-t" id="${prefix}-lbl">${label} <span class="muted" style="font-weight:500">(không bắt buộc)</span></span><div class="imgfld">
    <div class="imgprev" id="${prefix}-prev">${v ? `<img src="${esc(v)}" alt="Ảnh đang chọn">` : icon('image', 22)}</div>

      <div class="imgfld-row"><span class="btn btn-line btn-sm filebtn">${icon('upload', 16)} Tải ảnh lên<input type="file" accept="image/*" data-imgfile="${prefix}" aria-label="Tải ảnh lên cho ${esc(label.toLowerCase())}"></span><button type="button" class="btn btn-ghost btn-sm" data-act="img-clear" data-t="${prefix}" ${v ? '' : 'hidden'}>Bỏ ảnh</button></div>
      <p class="hint" id="${prefix}-note">${isData ? 'Đang dùng ảnh tải lên (' + Math.round(v.length * .75 / 1024) + ' KB).' : 'Ảnh tải lên được thu nhỏ tự động.'}</p><p class="err" id="${prefix}-err" hidden></p></div></div></div>`;
}
function setImg(prefix, src, note) {
  const h = document.getElementById(prefix); if (!h) return; h.value = src;
  const p = document.getElementById(prefix + '-prev'); p.innerHTML = src ? `<img src="${esc(src)}" alt="Ảnh đang chọn">` : icon('image', 22);
  const n = document.getElementById(prefix + '-note'); if (n && note) n.textContent = note;
  const c = document.querySelector(`[data-act="img-clear"][data-t="${prefix}"]`); if (c) c.hidden = !src;
  h.dispatchEvent(new Event('input', {bubbles: true}));
}
function showErrors(root, errs, map) {
  $$('.err', root).forEach(e => { if (e.id && e.id !== 'ed-global-err') { e.hidden = true; e.textContent = ''; } });
  $$('[aria-invalid]', root).forEach(e => e.removeAttribute('aria-invalid'));
  let first = null;
  Object.entries(errs).forEach(([k, msg]) => {
    const id = map[k]; if (!id) return; const el = document.getElementById(id); const er = document.getElementById(id + '-err') || document.getElementById(id.replace(/-url$/, '') + '-err');
    if (er) { er.textContent = msg; er.hidden = false; }
    const tgt = el && (el.closest('.slugrow') || el.closest('.rte') || el.closest('.tags') || el);
    if (tgt) { tgt.setAttribute('aria-invalid', 'true'); if (!first) first = el; }
    if (el && er) el.setAttribute('aria-describedby', er.id);
  });
  if (first) first.focus();
  return !Object.keys(errs).length;
}
const errP = id => `<p class="err" id="${id}-err" hidden></p>`;
function bindSlug(form, srcId, slugId) {
  const src = $('#' + srcId, form), sl = $('#' + slugId, form);
  if (!sl.value) sl.dataset.auto = '1';
  src.addEventListener('input', () => { if (sl.dataset.auto) sl.value = slugify(src.value); });
  sl.addEventListener('input', () => { delete sl.dataset.auto; });
  sl.addEventListener('blur', () => { const v = slugify(sl.value); if (v !== sl.value) sl.value = v; });
}

function deleteSectionFlow(id) {

async function deleteArticlesFlow(ids) {

  },
  actionsHTML(st, exists) {

    else if (st === 'archived') h = `<button type="button" class="btn btn-navy" data-act="ed-save" data-to="archived">${icon('check', 16)} Lưu</button><div class="row">${prev}<button type="button" class="btn btn-line" data-act="ed-save" data-to="draft">Bỏ lưu trữ</button></div><button type="button" class="btn btn-grad" data-act="ed-save" data-to="published">${icon('send', 16)} Xuất bản lại</button>`;
    else h = `<button type="button" class="btn btn-grad" data-act="ed-save" data-to="published">${icon('send', 16)} Xuất bản</button><div class="row"><button type="button" class="btn btn-navy" data-act="ed-save" data-to="draft">Lưu nháp</button>${prev}</div>`;
    if (exists) h += `<div class="row">${st !== 'archived' ? `<button type="button" class="btn btn-ghost btn-sm" data-act="ed-save" data-to="archived">${icon('archive', 16)} Chuyển vào lưu trữ</button>` : ''}<button type="button" class="btn btn-ghost btn-sm" data-act="duplicate" data-id="${esc(this.id)}">${icon('copy', 16)} Nhân bản</button><button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger)" data-act="ed-delete">${icon('trash', 16)} Xoá</button></div>`;
    return h;
  },
  mbarHTML(st) {
    return `<button type="button" class="btn btn-line" data-act="ed-preview">${icon('eye', 16)} Xem</button>` + (st === 'published'
      ? `<button type="button" class="btn btn-grad" data-act="ed-save" data-to="published">Cập nhật</button>`
      : `<button type="button" class="btn btn-navy" data-act="ed-save" data-to="${st === 'archived' ? 'archived' : 'draft'}">${st === 'archived' ? 'Lưu' : 'Lưu nháp'}</button><button type="button" class="btn btn-grad" data-act="ed-save" data-to="published">Xuất bản</button>`);
  },
  catSelect(secId, catId) {

  },
  mount({id}) {
    const form = $('#ed-form'); if (!form) return;
    const a = id ? D.art(id) : null;
    this.mounted = true; this.id = a ? a.id : uid('art'); this.isNew = !a; this.status = a ? a.status : 'draft';
    this.loadedUpdatedAt = a ? a.updatedAt : null; this.tags = a ? (a.tags || []).slice() : [];
    const ce = $('#f-content'); ce.innerHTML = a ? sanitizeHtml(a.content) : '';
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch {}
    const sl = $('#f-slug'); if (!sl.value) sl.dataset.auto = '1';
    $('#f-title').addEventListener('input', () => { if (sl.dataset.auto) sl.value = slugify($('#f-title').value); });
    sl.addEventListener('input', () => delete sl.dataset.auto);
    sl.addEventListener('blur', () => { const v = slugify(sl.value); if (v !== sl.value) { sl.value = v; this.changed(); } });
    $('#f-section').addEventListener('change', e => { const cur = $('#f-category') ? $('#f-category').value : ''; $('#f-category-wrap').innerHTML = this.catSelect(e.target.value, cur); this.changed(); });

      const html = h ? sanitizeHtml(h) : esc(t).split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join(''); document.execCommand('insertHTML', false, html); });

    form.addEventListener('input', () => this.changed());

  unmount() { this.mounted = false; this.range = null; },
  saveRange() { const s = window.getSelection(); if (s && s.rangeCount) { const r = s.getRangeAt(0); if ($('#f-content') && $('#f-content').contains(r.commonAncestorContainer)) this.range = r.cloneRange(); } return this.range; },
  restoreRange() { const ce = $('#f-content'); ce.focus(); if (this.range) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(this.range); } else { const r = document.createRange(); r.selectNodeContents(ce); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } },

  },
  toolbarState() {

  },
  openPop(which) {

    const p = $('#pop-' + which); $$('input', p).forEach(i => { if (i.type !== 'file') i.value = ''; });

  closePop() { $$('.rte-pop').forEach(p => p.hidden = true); },
  insertLink() {

  insertImage(src, alt) {

    this.closePop(); this.changed();
  },
  async insertImageFile(file) {
    try { const src = await storeImage(await fileToImage(file, 1000, .78)); this.insertImage(src, $('#pi-alt') ? $('#pi-alt').value.trim() : ''); toast('Đã chèn ảnh (' + Math.round(src.length * .75 / 1024) + ' KB).'); }
    catch (e) { toast(e.message, 'err'); }
  },
  renderTags() {
    const box = $('#f-tags'); if (!box) return;
    box.innerHTML = this.tags.map((t, i) => `<span class="tag">${esc(t)}<button type="button" data-act="tag-rm" data-i="${i}" aria-label="Bỏ thẻ ${esc(t)}">${icon('x', 12, 2.6)}</button></span>`).join('') + `<input id="f-tag-in" list="tag-list" placeholder="${this.tags.length ? '' : 'ví dụ: 24.10, lửa trại'}" maxlength="${LIM.tag}" autocomplete="off">`;
    const inp = $('#f-tag-in');
    inp.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ',') && inp.value.trim()) { e.preventDefault(); const v = inp.value; inp.value = ''; this.addTag(v); }
      else if (e.key === 'Enter') e.preventDefault();

  addTag(v, refocus = true) {
    v.split(',').map(x => x.trim().replace(/^#/, '').slice(0, LIM.tag)).filter(Boolean).forEach(t => { if (!this.tags.some(x => fold(x) === fold(t))) this.tags.push(t); });
    if (this.tags.length > LIM.tags) { this.tags = this.tags.slice(0, LIM.tags); toast(`Tối đa ${LIM.tags} thẻ.`, 'warn'); }

  collect() {

    finally { this.saving = false; $$('#ed-actions .btn, #ed-mbar .btn').forEach(b => b.disabled = false); }
  }
};

function authView() {

    <div class="fld"><label for="sp-1">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="sp-1" class="inp" type="password" autocomplete="new-password" minlength="8" required autofocus></div>

  return shell(`<form id="login-form" class="stack" style="gap:14px" novalidate><h2 class="h2">Đăng nhập</h2>
    <div class="fld"><label for="lg-email">Email</label><input id="lg-email" class="inp" type="email" autocomplete="username" required autofocus></div>
    <div class="fld"><label for="lg-pw">Mật khẩu</label><input id="lg-pw" class="inp" type="password" autocomplete="current-password" required></div>

document.addEventListener('submit', async e => {
  const f = e.target; if (!['login-form', 'setpw-form', 'recover-form'].includes(f.id)) return;
  e.preventDefault(); const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  const showErr = (id, msg) => { const el = document.getElementById(id); el.textContent = msg; el.hidden = false; };
  try {
    if (f.id === 'login-form') {
      const email = $('#lg-email').value.trim().toLowerCase(), pw = $('#lg-pw').value;
      if (!email || !pw) { showErr('lg-err', 'Hãy nhập email và mật khẩu.'); return; }
      try { await SB.signIn(email, pw); } catch (er) { showErr('lg-err', er.code === 'network' ? er.message : (er.code === 'invalid_credentials' || er.status === 400) ? 'Email hoặc mật khẩu không đúng.' : 'Không đăng nhập được: ' + er.message); return; }
      Store.authMsg = ''; await Store.afterLogin(); if (Store.ready) toast('Đã đăng nhập.');
    } else if (f.id === 'setpw-form') {
      const a = $('#sp-1').value, b = $('#sp-2').value;
      if (a.length < 8) { showErr('sp-err', 'Mật khẩu cần ít nhất 8 ký tự.'); return; }
      if (a !== b) { showErr('sp-err', 'Hai lần nhập mật khẩu không khớp.'); return; }
      try { await SB.setPassword(a); } catch (er) { showErr('sp-err', 'Không đổi được mật khẩu: ' + er.message); return; }
      Store.authNeed = null; Store.authMsg = ''; toast('Đã lưu mật khẩu mới.'); await Store.afterLogin();
    } else {
      const email = $('#rc-email').value.trim().toLowerCase(); if (!email) { showErr('rc-err', 'Hãy nhập email.'); return; }
      try { await SB.recover(email); } catch (er) { showErr('rc-err', 'Không gửi được: ' + er.message); return; }
      Store.auth = 'login'; Store.authMsg = 'Nếu email này có tài khoản, liên kết đặt lại mật khẩu đã được gửi. Hãy kiểm tra hộp thư (cả mục Spam).'; render();
    }
  } finally { if (btn.isConnected) btn.disabled = false; }
});

const HC = {
  data: {}, saved: {}, cur: 'history', loaded: false, loading: false, err: '', saving: false, missingTable: false,
  keys() { return [...Object.keys(HC_BLOCKS), 'settings']; },

      this.data.settings = {introVideoId: String(st.introVideoId || ''), registrationOpen: st.registrationOpen !== false, showCountdown: st.showCountdown !== false}; this.stExtra = {...st};
      this.keys().forEach(k => { this.saved[k] = this.snap(k); });
      this.loaded = true; this.missingTable = false;
    } catch (e) {
      this.missingTable = e && (e.status === 404 || /PGRST205|42P01/.test(String(e.code)));
      this.err = this.missingTable ? 'Chưa có bảng site_content. Hãy chạy tệp supabase/site_content.sql trong Supabase (SQL Editor), rồi tải lại trang.' : (e && e.message) || 'Không tải được nội dung trang chủ.';

const MU_KS = Array.from({length: 20}, (_, i) => 'K' + (48 + i));
const MU_URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;

const MU = {
  rows: [], loaded: false, loading: false, err: '', cur: 'K48', driveUrl: '', prog: [], busy: false, missing: false, test: '',
  inK(k) { return this.rows.filter(r => r.k === (k || this.cur)); },
  async load() {
    if (this.loading) return; this.loading = true; this.err = ''; this.draw();
    try {
      this.rows = await SB.req('/rest/v1/museum_photos?select=*&order=sort_order.asc,created_at.asc&limit=5000') || [];
      const st = await SB.req('/rest/v1/site_content?select=data&key=eq.settings').catch(() => []);
      this.driveUrl = String(st && st[0] && st[0].data && st[0].data.driveUrl || '');
      this.loaded = true; this.missing = false;

    }
    this.loading = false; this.draw();
  },
  mount() { if (!this.loaded && !this.loading) this.load(); else this.draw(); },
  async gas(action, extra) {
    if (!MU_URL_RE.test(this.driveUrl)) throw {message: 'Chưa kết nối Google Drive. Dán địa chỉ Apps Script ở phần “Kết nối Google Drive”.'};
    await SB.ensureFresh();
    let res, j;
    try { res = await fetch(this.driveUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: SB.session && SB.session.access_token, ...extra})}); j = await res.json(); }
    catch { throw {message: 'Không kết nối được Google Apps Script. Kiểm tra địa chỉ và quyền truy cập “Bất kỳ ai” khi triển khai.'}; }

    return j;

  async shrink(file) {
    let bmp; try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch { throw {message: 'Không đọc được ảnh (định dạng không hỗ trợ, ví dụ HEIC).'}; }
    const sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86)); if (!blob) throw {message: 'Không nén được ảnh.'};
    return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
  },
  async upload(files) {
    if (this.busy) return; const k = this.cur; files = [...files].filter(f => /^image\//.test(f.type));
    if (!files.length) { toast('Hãy chọn tệp ảnh.', 'err'); return; }

    let ok = 0, base = Math.max(0, ...this.inK(k).map(r => r.sort_order || 0));

      this.prog[i].st = 'run'; this.draw();

        const j = await this.gas('upload', {k, name: `${nm}.jpg`, mime: 'image/jpeg', data});

  const cats = D.allCats().filter(c => c.status === 'active' && secIds.has(c.sectionId));
  const catIds = new Set(cats.map(c => c.id));
  const arts = Store.data.articles.filter(a => a.status === 'published' && catIds.has(a.categoryId) && D.cat(a.categoryId).sectionId === a.sectionId)
    .sort((a, b) => cmp(b.publishedAt, a.publishedAt));
  return {app: 'hdx-site', version: 1, generatedAt: nowISO(),
    sections: secs.map(({id, name, slug, description, image, order}) => ({id, name, slug, description, image, order})),
    categories: cats.map(({id, sectionId, name, slug, description, image, order}) => ({id, sectionId, name, slug, description, image, order})),
    articles: arts.map(({id, title, slug, excerpt, content, cover, sectionId, categoryId, author, tags, publishedAt}) => ({id, title, slug, excerpt, content: sanitizeHtml(content), cover, sectionId, categoryId, author, tags: tags || [], publishedAt}))};
}
ACT['export-site'] = async () => {
  const json = JSON.stringify(siteContent(), null, 1);
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) { try { await dl.save({filename: 'content.json', data: json}); toast('Đã tải content.json. Giờ hãy tải tệp này lên repo GitHub.'); return; } catch (e) { if (e && e.code === 'declined') { toast('Đã huỷ tải tệp.', 'warn'); return; } } }
  ACT['export-site-show'](); toast('Trình xem này không cho tải tệp. Hãy sao chép nội dung bên dưới vào tệp content.json.', 'warn');
};
ACT['export-site-show'] = () => { const box = $('#export-site-box'); if (!box) return; box.innerHTML = `<div class="fld" style="margin-top:14px"><label for="exp-site-ta">Nội dung content.json</label><textarea id="exp-site-ta" class="ta codebox" readonly>${esc(JSON.stringify(siteContent(), null, 1))}</textarea><div class="qa"><button class="btn btn-line btn-sm" data-act="copy-export" data-t="exp-site-ta">${icon('copy', 16)} Sao chép</button></div></div>`; };

async function saveFile(name, text) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) { try { await dl.save({filename: name, data: text}); return 'saved'; } catch (e) { if (e && e.code === 'declined') return 'declined'; } }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return 'saved'; } catch { return 'failed'; }
}
function exportData() { return {app: 'hdx-cms', version: 1, exportedAt: nowISO(), sections: Store.data.sections, categories: Store.data.categories, articles: Store.data.articles}; }
async function importText(text) {
  let obj; try { obj = JSON.parse(text); } catch { toast('Nội dung không phải JSON hợp lệ.', 'err'); return; }
  const n = normalizeImport(obj);
  if (n.errors.length) {
    Modal.open({title: 'Không thể nhập tệp này', body: `<div class="notice danger">${icon('warn')}<div>Phát hiện ${n.errorCount || n.errors.length} lỗi. Dữ liệu hiện có <b>chưa bị thay đổi</b>.<ul style="margin:8px 0 0;padding-left:18px">${n.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div></div>`, foot: `<button type="button" class="btn btn-navy" data-mclose>Đã hiểu</button>`});
    return;
  }
  const d = n.data, cur = `${Store.data.sections.length} chuyên mục, ${Store.data.categories.length} danh mục, ${Store.data.articles.length} bài viết`;
  const ok = await confirmDialog({title: 'Thay thế toàn bộ dữ liệu?', message: `Tệp hợp lệ: <b>${d.sections.length} chuyên mục, ${d.categories.length} danh mục, ${d.articles.length} bài viết</b>.<br>Dữ liệu hiện có (${cur}) sẽ bị <b>thay thế hoàn toàn</b>${Store.mode === 'cloud' ? ' cho tất cả người dùng chung' : ''}.`, confirmLabel: 'Thay thế dữ liệu', danger: true, typeToConfirm: 'THAY THẾ'});
  if (!ok) return;
  try { await Repo.replaceAll(d, (i, n2) => { if (n2 > 20 && i % 10 === 0) toast(`Đang ghi ${i}/${n2}…`, 'warn', 1500); }); toast('Đã nhập dữ liệu từ bản sao lưu.'); }
  catch (e) { toast(e.message || 'Nhập dữ liệu thất bại.', 'err'); }
}

document.addEventListener('click', e => {
  const tbBtn = e.target.closest('.tb');
  if (tbBtn) { e.preventDefault(); if (tbBtn.dataset.pop) Editor.openPop(tbBtn.dataset.pop); else Editor.exec(tbBtn.dataset.cmd, tbBtn.dataset.val); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el, e);
});
document.addEventListener('mousedown', e => { if (e.target.closest('.tb')) e.preventDefault(); });
document.addEventListener('selectionchange', () => { if (Editor.mounted && document.activeElement && document.activeElement.id === 'f-content') { Editor.saveRange(); Editor.toolbarState(); } });
let fTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.f) {
    const [v, k] = el.dataset.f.split('.'); const f = S.filters[v];
    f[k] = k === 'size' ? Number(el.value) : el.value;
    if (v === 'articles' && k !== 'page') f.page = 1;
    if (v === 'articles' && k === 'section') { const c = D.cat(f.category); if (c && f.section && c.sectionId !== f.section) f.category = ''; }
    if (v === 'articles' && k === 'category' && f.category) { const c = D.cat(f.category); if (c) f.section = c.sectionId; }
    saveUiState(); clearTimeout(fTimer); fTimer = setTimeout(render, el.type === 'search' ? 120 : 0);
  }
  if (el.dataset && el.dataset.imgurl) { const p = el.dataset.imgurl; const v = el.value.trim(); const s = safeImg(v); const er = document.getElementById(p + '-err');
    if (er) { er.hidden = !v || !!s; er.textContent = v && !s ? 'Liên kết ảnh phải bắt đầu bằng https://' : ''; }
    const h = document.getElementById(p); h.value = s || (v ? v : ''); const pv = document.getElementById(p + '-prev'); pv.innerHTML = s ? `<img src="${esc(s)}" alt="Ảnh đang chọn">` : icon('image', 22);
    const c = document.querySelector(`[data-act="img-clear"][data-t="${p}"]`); if (c) c.hidden = !v; const n = document.getElementById(p + '-note'); if (n) n.textContent = 'Ảnh tải lên được thu nhỏ tự động.'; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset && el.dataset.imgfile) { const f = el.files[0]; el.value = ''; if (!f) return; const p = el.dataset.imgfile;
    try { const src = await storeImage(await fileToImage(f, p === 'f-cover' ? 1400 : 800, .8)); setImg(p, src, src.startsWith('data:') ? `Đang dùng ảnh tải lên (${Math.round(src.length * .75 / 1024)} KB).` : 'Đã tải ảnh lên kho ảnh.'); if (src.startsWith('http')) { const u = document.getElementById(p + '-url'); if (u) { u.value = src; } } if (src.startsWith('data:')) { const u = document.getElementById(p + '-url'); if (u) u.value = ''; } toast('Đã tải ảnh lên.'); }
    catch (err) { toast(err.message, 'err'); } }
  if (el.id === 'imp-file') { const f = el.files[0]; el.value = ''; if (!f) return; if (f.size > 20 * 1024 * 1024) { toast('Tệp quá lớn (tối đa 20 MB).', 'err'); return; } importText(await f.text()); }
});
$('#gsearch').addEventListener('submit', e => { e.preventDefault(); const q = $('#g-q').value.trim(); S.filters.search.q = q; saveUiState(); if (S.route.name === 'search') render(); else go('search'); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.route.name === 'edit' && Editor.mounted && !Modal.top()) { e.preventDefault(); Editor.save(Editor.status === 'published' ? 'published' : Editor.status === 'archived' ? 'archived' : 'draft'); }
  if (e.key === '/' && !Modal.top() && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) { e.preventDefault(); $('#g-q').focus(); }
});
window.addEventListener('beforeunload', e => { if (S.route.name === 'edit' && Editor.isDirty()) { e.preventDefault(); e.returnValue = ''; } });

/* Boot */
(async function boot() {
  if (!['dashboard','sections','section','categories','category','articles','article','edit','site','search','backup'].includes(S.route.name)) S.route = {name: 'dashboard', params: {}};
  render();
  await Store.init();
  if (Store.mode === 'local' && Store.localFirstRun) {
    try { const d = await fetchSample(); await Repo.replaceAll(d); toast('Đã nạp dữ liệu mẫu để bạn thử ngay. Dữ liệu chỉ lưu trên trình duyệt này.', 'warn', 6000); } catch { /* empty state offers a button */ }
  }
  render();
})();
</script>
</body>
</html>
